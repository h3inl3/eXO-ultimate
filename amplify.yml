# Amplify Hosting build for apps/web (pnpm monorepo; .npmrc already sets node-linker=hoisted).
version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - corepack enable
            # Only the web app and what it depends on; skips the Expo/React Native tree.
            - pnpm install --frozen-lockfile --filter @exo/web...
        build:
          commands:
            - pnpm --filter @exo/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
