<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team home, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5FA5}a:hover{color:#083F6E}
</style>
</helmet>
<div style="min-height: 960px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: Inter, system-ui, sans-serif">

<aside style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; padding: 24px 16px; background: {{t.surface}}; border-right: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{t.blue}}; color: {{t.onBlue}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">eXO</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">eXO Ultimate</span>
</div>
<button aria-label="Switch team" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.text}}; font: inherit; text-align: left">
<span style="flex: 1"><span style="display: block; font-weight: 700">Night Owls</span><span style="display: block; font-size: 12px; color: {{t.muted}}">Mixed · Coach</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: {{tab.bg}}; color: {{tab.color}}; font-weight: 600; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
{{tab.label}}
</a>
</sc-for>
</nav>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 4vw, 48px) 48px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px">
<div>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: {{t.muted}}">Spring League · Week 4</p>
<h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.5px">Team home</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1.5px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; font: 600 15px Inter, sans-serif">Add player</button>
<button style="height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: {{t.orange}}; color: #1A0D00; font: 700 15px Inter, sans-serif">New game</button>
</div>
</header>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px">
<div style="border-radius: 20px; padding: 24px; background: {{t.hero}}; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600">Live · Field 3 · to 15</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #FF8A2A; color: #1A0D00; font-size: 12px; font-weight: 700">LIVE</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-around; font-family: 'Space Grotesk', sans-serif">
<div style="text-align: center"><div style="font: 600 14px Inter, sans-serif">Night Owls</div><div style="font-size: 64px; font-weight: 700; line-height: 1">7</div></div>
<div style="font: 14px Inter, sans-serif; text-align: center">Pt 13<br>Offense</div>
<div style="text-align: center"><div style="font: 600 14px Inter, sans-serif">Riptide</div><div style="font-size: 64px; font-weight: 700; line-height: 1">5</div></div>
</div>
<div style="display: flex; gap: 10px">
<a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #FF8A2A; color: #1A0D00; font-weight: 700; text-decoration: none">Watch live</a>
<a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.16); color: #FFFFFF; font-weight: 600; text-decoration: none">Box score</a>
</div>
</div>

<div style="border-radius: 20px; padding: 20px 4px 8px; background: {{t.surface}}; border: 1px solid {{t.line}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 8px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px">Schedule</h2>
<a href="#" style="font-size: 14px; font-weight: 600; color: {{t.link}}">See all</a>
</div>
<sc-for list="{{games}}" as="g" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: {{g.border}}">
<div style="width: 44px; text-align: center"><div style="font-size: 11px; font-weight: 700; color: {{t.muted}}">{{g.day}}</div><div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{g.date}}</div></div>
<div style="flex: 1"><div style="font-weight: 600">vs {{g.opp}}</div><div style="font-size: 13px; color: {{t.muted}}">{{g.meta}}</div></div>
<span style="padding: 4px 10px; border-radius: 999px; background: {{g.chipBg}}; color: {{g.chipFg}}; font-size: 13px; font-weight: 700">{{g.result}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{boards}}" as="b" hint-placeholder-count="3">
<div style="border-radius: 20px; padding: 20px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: {{t.muted}}">{{b.title}}</h2>
<sc-for list="{{b.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{r.avatar}}; display: flex; align-items: center; justify-content: center; font: 700 14px 'Space Grotesk', sans-serif">{{r.num}}</span>
<span style="flex: 1; font-weight: 600">{{r.name}}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{r.val}}</span>
</div>
</sc-for>
</div>
</sc-for>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
const THEME = (d) => d ? {
  bg:'#07141F', surface:'#0F2233', surface2:'#163049', line:'#23415C', text:'#EAF3FA', muted:'#9DB3C6', link:'#7CC0F7',
  blue:'#4EA8F2', onBlue:'#04111C', green:'#34C98B', orange:'#FF8A2A', chipBlue:'#123A5C', chipGreen:'#0F3B2E',
  hero:'linear-gradient(135deg,#0B4F8A,#0B6B5A)'
} : {
  bg:'#F3F7FB', surface:'#FFFFFF', surface2:'#E8F0F7', line:'#D3E0EB', text:'#0B1F33', muted:'#4A5D70', link:'#0B5FA5',
  blue:'#0B5FA5', onBlue:'#FFFFFF', green:'#0B7A55', orange:'#F07A1A', chipBlue:'#DCEBF8', chipGreen:'#D9F2E7',
  hero:'linear-gradient(135deg,#0B5FA5,#0B7A55)'
};
const ICONS = {
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  roster:'M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6M20 19v-1a3 3 0 0 0-3-3M4 19v-1a3 3 0 0 1 3-3',
  games:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10',
  plays:'M4 4h16v16H4zM8 9l3 3M11 9l-3 3M14 15h3M15 8c2 1 2 4 0 6',
  stats:'M5 20V10M12 20V4M19 20v-7'
};
class Component extends DCLogic {
  renderVals() {
    const t = THEME(this.props.dark ?? false);
    const tabs = [['Home','home'],['Roster','roster'],['Games','games'],['Playbook','plays'],['Stats','stats']]
      .map(([label,k],i) => ({ label, icon: ICONS[k], bg: i === 0 ? t.chipBlue : 'transparent', color: i === 0 ? t.text : t.muted }));
    const games = [
      { day:'SAT', date:'14', opp:'Riptide', meta:'10:00 · Field 3 · to 15', result:'LIVE', chipBg: t.orange, chipFg:'#1A0D00' },
      { day:'SAT', date:'7', opp:'Polar Bears', meta:'Final · to 15', result:'W 15–11', chipBg: t.chipGreen, chipFg: t.text },
      { day:'SUN', date:'1', opp:'Sky Hawks', meta:'Final · capped', result:'L 12–13', chipBg: t.surface2, chipFg: t.text }
    ].map((g,i) => ({ ...g, border: i ? '1px solid ' + t.line : '0' }));
    const row = (num,name,val,f) => ({ num, name, val, avatar: f ? t.chipGreen : t.chipBlue });
    const boards = [
      { title:'Goals', rows:[row('22','Kai Ito',9,0),row('3','Mei Chen',7,1),row('11','Sam Ruiz',5,0)] },
      { title:'Assists', rows:[row('7','Jo Park',11,1),row('42','Alex Moe',8,0),row('3','Mei Chen',6,1)] },
      { title:'Ds', rows:[row('18','Ria Das',6,1),row('9','Dev Rao',4,0),row('22','Kai Ito',3,0)] }
    ];
    return { t, tabs, games, boards };
  }
}
</script>
</body>
</html>
